name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Dispatched by the version job after it pushes a version commit: pushes made
  # with GITHUB_TOKEN never trigger workflows, so the required checks for the
  # new head commit are started explicitly.
  workflow_dispatch:

# Jobs get write access only where they need it.
permissions:
  contents: read

# A newer push to the same ref supersedes a running check. Runs on main
# publish releases, so every main run gets its own group (per commit): a shared
# group would let GitHub replace a pending main run, and that merge would never
# be released.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      fuzz_required: ${{ steps.filter.outputs.fuzz_required }}
    steps:
      - name: Checkout full history for change detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changes requiring the short fuzz run
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import subprocess
          import tomllib

          def git(*args):
              return subprocess.check_output(["git", *args])

          def versionless(path, content):
              data = tomllib.loads(content.decode())
              if path == "Cargo.toml":
                  data["package"].pop("version", None)
              else:
                  for package in data.get("package", []):
                      if package.get("name") == "rentman-client":
                          package.pop("version", None)
              return data

          def relevant(path, base):
              # Unknown paths are relevant; only documentation and the CI-generated
              # crate version are exempt. Dependency and toolchain changes still run fuzzing.
              # Fuzz inputs can be text files; their path takes priority over extensions.
              # Keep the generated crate-version exception for the fuzz lockfile.
              if path.startswith("fuzz/") and path != "fuzz/Cargo.lock":
                  return True
              if path.endswith((".md", ".rst", ".txt")) or path in ("LICENSE", "LICENSE-MIT", "LICENSE-APACHE"):
                  return False
              if path in ("Cargo.toml", "Cargo.lock", "fuzz/Cargo.lock"):
                  try:
                      return versionless(path, git("show", f"{base}:{path}")) != versionless(path, git("show", f"HEAD:{path}"))
                  except (subprocess.CalledProcessError, KeyError, tomllib.TOMLDecodeError):
                      return True
              return True

          base = os.environ.get("BASE_SHA", "")
          default = os.environ["DEFAULT_BRANCH"]
          if not base or set(base) == {"0"}:
              if os.environ["GITHUB_REF"] == f"refs/heads/{default}":
                  # A manual default-branch run has no change range: run conservatively.
                  print("fuzz_required=true")
                  raise SystemExit(0)
              # Version-job dispatches must compare the whole PR branch, not only
              # the generated version commit, or they could miss earlier code changes.
              base = git("merge-base", f"origin/{default}", "HEAD").decode().strip()
          paths = git("diff", "--no-renames", "--name-only", "-z", base, "HEAD").decode().split("\0")
          required = any(relevant(path, base) for path in paths if path)
          print(f"fuzz_required={str(required).lower()}")
          PY

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    outputs:
      version: ${{ steps.effective.outputs.version }}
      version_tag: ${{ steps.effective.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-version walks the full history and tags to derive the version.
          fetch-depth: 0
          # On pull requests, check out the branch head instead of the merge
          # commit so the derived version can be committed back to the branch.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Identify the pull request branch
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && \
               [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            pr="$(gh pr list --state open --head "$GITHUB_REF_NAME" --base "$DEFAULT_BRANCH" \
              --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')"
            if [ -n "$pr" ]; then
              echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Calculate semantic version
        id: semantic
        uses: PaulHatch/semantic-version@4d6da96a9bc3116da3613309a11ff75fba58eb8d # v6.0.4
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
      - name: Resolve effective version
        id: effective
        env:
          DERIVED: ${{ steps.semantic.outputs.version }}
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          version="$DERIVED"
          if [ -n "$manifest" ] && [ "$manifest" != "$DERIVED" ] && \
             [ "$(printf '%s\n%s\n' "$DERIVED" "$manifest" | sort -V | tail -n 1)" = "$manifest" ]; then
            echo "Keeping manually raised Cargo.toml version $manifest (derived: $DERIVED)"
            version="$manifest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$version" >> "$GITHUB_OUTPUT"
      # Outside pull requests there is no branch the job could push a fix to,
      # so a version mismatch must fail loudly instead of being papered over.
      - name: Verify Cargo.toml carries the effective version
        if: steps.pull-request.outputs.branch == ''
        env:
          VERSION: ${{ steps.effective.outputs.version }}
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::Cargo.toml version $manifest does not match the effective version $VERSION. The version job cannot commit a fix outside pull requests; raise the version on a pull request branch instead."
            exit 1
          fi
      - name: Commit derived version to the branch
        if: steps.pull-request.outputs.branch != ''
        env:
          VERSION: ${{ steps.effective.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.pull-request.outputs.branch }}
        run: |
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"rentman-client\"\$/{n;s/^version = \".*\"\$/version = \"$VERSION\"/;}" Cargo.lock
          if git diff --quiet; then
            echo "Cargo.toml already carries version $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Set crate version to $VERSION"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          gh workflow run ci.yml --ref "$PR_BRANCH"

  checks:
    runs-on: ubuntu-latest
    needs: version
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Apply semantic version to Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"rentman-client\"\$/{n;s/^version = \".*\"\$/version = \"$VERSION\"/;}" Cargo.lock
          grep '^version = ' Cargo.toml
      - name: Check formatting
        run: cargo fmt --all -- --check
      # Regenerates from the checked-in spec only (no download), so a change to
      # the generator or its configuration cannot be merged without its output.
      # Cargo.toml and Cargo.lock carry the version applied above.
      - name: Check generated files are up to date
        run: |
          cargo xtask generate-openapi
          stale="$(git status --porcelain -- . ':!Cargo.toml' ':!Cargo.lock')"
          if [ -n "$stale" ]; then
            echo "$stale"
            git diff -- . ':!Cargo.toml' ':!Cargo.lock'
            echo "::error::Generated files are stale; run 'cargo xtask generate-openapi' and commit the result."
            exit 1
          fi
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run documentation tests
        run: cargo test --workspace --locked --doc
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --locked --no-deps
      - name: Run clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

  msrv:
    name: MSRV build and tests
    runs-on: ubuntu-latest
    needs: version
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Build and test with the MSRV
        run: cargo test --workspace --locked

  package:
    name: Package build and smoke test
    runs-on: ubuntu-latest
    needs: version
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      # The version is not rewritten here: the package is checked as committed,
      # so the working tree stays clean and no --allow-dirty is needed.
      - name: Build the package and smoke test it outside the source tree
        run: scripts/package_smoke_test.sh
      - name: Upload the verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rentman-client-crate-${{ github.sha }}
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    needs: version
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Apply semantic version to Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"rentman-client\"\$/{n;s/^version = \".*\"\$/version = \"$VERSION\"/;}" Cargo.lock
          grep '^version = ' Cargo.toml
      - name: "Coverage-Gate (100%: regions, lines, functions)"
        run: |
          cargo +nightly llvm-cov --workspace --locked \
            --fail-under-regions 100 \
            --fail-under-lines 100 \
            --fail-under-functions 100

  # Keep the existing required status context.
  test:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [version, checks, coverage, msrv, package]
    steps:
      - name: Require every CI validation job to succeed
        env:
          CORE_RESULTS: ${{ needs.version.result }} ${{ needs.checks.result }} ${{ needs.coverage.result }} ${{ needs.msrv.result }} ${{ needs.package.result }}
        run: |
          echo "Required CI job results: $CORE_RESULTS"
          if [ "$CORE_RESULTS" != "success success success success success" ]; then
            echo "::error::Every CI validation job must succeed."
            exit 1
          fi
  release:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [version, test, coverage, msrv, package]
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Apply semantic version to Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"rentman-client\"\$/{n;s/^version = \".*\"\$/version = \"$VERSION\"/;}" Cargo.lock
      # On main the version job has already verified that Cargo.toml carries
      # the effective version, so the step above changes nothing and the tree
      # is clean. The package is verified again from this exact commit before
      # it is published; publishing never uses --allow-dirty.
      - name: Verify the package from this commit
        run: scripts/package_smoke_test.sh
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.version_tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
