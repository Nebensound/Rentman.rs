name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      version_tag: ${{ steps.semantic.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semantic-version walks the full history and tags to derive the version.
          fetch-depth: 0
      - name: Calculate semantic version
        id: semantic
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"

  test:
    runs-on: ubuntu-latest
    needs: version
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Apply semantic version to Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          grep '^version = ' Cargo.toml
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace
      - name: Run documentation tests
        run: cargo test --workspace --doc
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    needs: version
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Apply semantic version to Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          grep '^version = ' Cargo.toml
      - name: "Coverage-Gate (100%: regions, lines, functions)"
        run: |
          cargo +nightly llvm-cov --workspace --locked \
            --fail-under-regions 100 \
            --fail-under-lines 100 \
            --fail-under-functions 100

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [version, test, coverage]
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply semantic version to Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.version_tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
