name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Dispatched by the version job after it pushes a version commit: pushes made
  # with GITHUB_TOKEN never trigger workflows, so the required checks for the
  # new head commit are started explicitly.
  workflow_dispatch:

# Jobs get write access only where they need it.
permissions:
  contents: read

# A newer push to the same ref supersedes a running check. Runs on main are
# never cancelled, because they publish releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      version: ${{ steps.effective.outputs.version }}
      version_tag: ${{ steps.effective.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-version walks the full history and tags to derive the version.
          fetch-depth: 0
          # On pull requests, check out the branch head instead of the merge
          # commit so the derived version can be committed back to the branch.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Calculate semantic version
        id: semantic
        uses: PaulHatch/semantic-version@4d6da96a9bc3116da3613309a11ff75fba58eb8d # v6.0.4
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
      - name: Resolve effective version
        id: effective
        env:
          DERIVED: ${{ steps.semantic.outputs.version }}
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          version="$DERIVED"
          if [ -n "$manifest" ] && [ "$manifest" != "$DERIVED" ] && \
             [ "$(printf '%s\n%s\n' "$DERIVED" "$manifest" | sort -V | tail -n 1)" = "$manifest" ]; then
            echo "Keeping manually raised Cargo.toml version $manifest (derived: $DERIVED)"
            version="$manifest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$version" >> "$GITHUB_OUTPUT"
      # Outside pull requests there is no branch the job could push a fix to,
      # so a version mismatch must fail loudly instead of being papered over.
      - name: Verify Cargo.toml carries the effective version
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.effective.outputs.version }}
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::Cargo.toml version $manifest does not match the effective version $VERSION. The version job cannot commit a fix outside pull requests; raise the version on a pull request branch instead."
            exit 1
          fi
      - name: Commit derived version to the branch
        if: github.event_name == 'pull_request'
        env:
          VERSION: ${{ steps.effective.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"rentman-client\"\$/{n;s/^version = \".*\"\$/version = \"$VERSION\"/;}" Cargo.lock
          if git diff --quiet; then
            echo "Cargo.toml already carries version $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Set crate version to $VERSION"
          git push
          gh workflow run ci.yml --ref "$GITHUB_HEAD_REF"

  test:
    runs-on: ubuntu-latest
    needs: version
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Apply semantic version to Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"rentman-client\"\$/{n;s/^version = \".*\"\$/version = \"$VERSION\"/;}" Cargo.lock
          grep '^version = ' Cargo.toml
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run documentation tests
        run: cargo test --workspace --locked --doc
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --locked --no-deps
      - name: Run clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

  msrv:
    name: MSRV build and tests
    runs-on: ubuntu-latest
    needs: version
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Build and test with the MSRV
        run: cargo test --workspace --locked

  package:
    name: Package build and smoke test
    runs-on: ubuntu-latest
    needs: version
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      # The version is not rewritten here: the package is checked as committed,
      # so the working tree stays clean and no --allow-dirty is needed.
      - name: Build the package and smoke test it outside the source tree
        run: scripts/package_smoke_test.sh
      - name: Upload the verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rentman-client-crate-${{ github.sha }}
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    needs: version
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Apply semantic version to Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"rentman-client\"\$/{n;s/^version = \".*\"\$/version = \"$VERSION\"/;}" Cargo.lock
          grep '^version = ' Cargo.toml
      - name: "Coverage-Gate (100%: regions, lines, functions)"
        run: |
          cargo +nightly llvm-cov --workspace --locked \
            --fail-under-regions 100 \
            --fail-under-lines 100 \
            --fail-under-functions 100

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [version, test, coverage, msrv, package]
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      - name: Apply semantic version to Cargo.toml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"rentman-client\"\$/{n;s/^version = \".*\"\$/version = \"$VERSION\"/;}" Cargo.lock
      # On main the version job has already verified that Cargo.toml carries
      # the effective version, so the step above changes nothing and the tree
      # is clean. The package is verified again from this exact commit before
      # it is published; publishing never uses --allow-dirty.
      - name: Verify the package from this commit
        run: scripts/package_smoke_test.sh
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.version_tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
