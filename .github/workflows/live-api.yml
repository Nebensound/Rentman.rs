name: Live API

# Non-blocking verification against the real Rentman API: the checked-in
# OpenAPI contract can drift from reality, and only live calls catch that.
# Deliberately not part of the required pull request checks so a Rentman
# outage never blocks merges.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Run live API tests
        env:
          RENTMAN_API_TOKEN: ${{ secrets.RENTMAN_API_TOKEN }}
          # Optional repository variable (not a secret): enables the no-op
          # equipment price write test. Unset, the test skips itself.
          RENTMAN_LIVE_WRITE_EQUIPMENT_ID: ${{ vars.RENTMAN_LIVE_WRITE_EQUIPMENT_ID }}
        run: |
          if [ -z "$RENTMAN_API_TOKEN" ]; then
            echo "::error::The RENTMAN_API_TOKEN repository secret is not configured"
            exit 1
          fi
          cargo test --locked --test live_api
