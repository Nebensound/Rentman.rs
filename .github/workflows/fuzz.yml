name: Fuzz

# Long fuzz run of the amount parser. Non-blocking like the live tests: it
# searches for inputs nobody thought of, and a finding becomes a regression
# test in the library. Every pull request runs a short fuzz run in CI.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 0"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          cache-on-failure: true
      - name: Install cargo-fuzz
        # Built from source: the prebuilt binary is a musl build, and cargo
        # fuzz then targets musl, where the address sanitizer is unavailable.
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Check the fuzz lockfile
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Fuzz amount parsing
        run: |
          mkdir -p fuzz/corpus/amount
          cargo +nightly fuzz run amount fuzz/corpus/amount fuzz/seeds/amount -- \
            -max_total_time=1800 -dict=fuzz/amount.dict
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
