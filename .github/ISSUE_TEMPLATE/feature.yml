name: Feature or change
description: Propose new functionality or a change in behavior.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What do you want to achieve, and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could the API look? Include a code sketch if possible.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: When is this done?
    validations:
      required: true
  - type: dropdown
    id: breaking
    attributes:
      label: Breaking change?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
