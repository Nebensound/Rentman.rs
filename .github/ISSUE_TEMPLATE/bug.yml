name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the full error chain (print it with `{error:#}` or `{error:?}`) and, if known, the failing operation and HTTP status. On versions with the typed error API, `error.kind()`, `error.operation()`, and `error.status()` give these directly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can it be reproduced?
      description: Minimal code or steps. Never include a real API token.
      render: rust
    validations:
      required: true
  - type: input
    id: crate-version
    attributes:
      label: rentman-client version
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust version (`rustc --version`)
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Affected endpoint or method
      placeholder: "e.g. all_invoices() or GetFactuurCollectionEndpoint"
