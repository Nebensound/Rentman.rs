[package]
name = "rentman-client"
version = "0.9.0"
edition = "2024"
# Minimum supported Rust version. CI builds and tests with exactly this
# toolchain; raising it is a minor version bump.
rust-version = "1.88"
description = "Typed Rentman API client with OpenAPI contract tests."
license = "MIT"
repository = "https://github.com/Nebensound/Rentman.rs"
readme = "crates-io.md"
exclude = ["/.github", "/README.md", "/fuzz"]

[dependencies]
backon = "1.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
governor = "0.10.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rust_decimal = { version = "1.42.1", default-features = false, features = ["serde-float", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[dev-dependencies]
bigdecimal = "0.4.11"
dotenvy = "0.15.7"
proptest = "1.12.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[build-dependencies]
dotenvy = "0.15.7"
